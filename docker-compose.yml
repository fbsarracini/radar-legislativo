services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-radar}
      POSTGRES_USER: ${DB_USERNAME:-radar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-radar} -d ${DB_NAME:-radar}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
