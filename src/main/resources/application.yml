server:
  port: 8080

spring:
  application:
    name: radar-legislativo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/radar}
    username: ${DB_USERNAME:radar}
    # Sem default: a app falha no boot se DB_PASSWORD não estiver definido (fail-fast). Ver .env.sample.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        page-parameter: pagina
        size-parameter: tamanho
        max-page-size: 100
        serialization-mode: via-dto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Actuator — só expõe /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

radar:
  http:
    connect-timeout: 10s
    read-timeout: 60s
    user-agent: radar-legislativo/0.1
    # Retry em 5xx/429/timeout. A Câmara devolve 504 em 25–50% dos requests (falhas independentes),
    # então muitas tentativas curtas: esperas de 1s, 2s, 4s, 8s, 8s.
    tentativas: 6
    espera-entre-tentativas: 1s
    espera-maxima-entre-tentativas: 8s

  cors:
    origens: [http://localhost:5173, http://localhost:4200, http://localhost:3000]

  camara:
    base-url: https://dadosabertos.camara.leg.br/api/v2
    # 57 = 2023-2027 (atual); 58 = 2027-2031 (eleitos em 2026, posse em fev/2027)
    legislaturas: [57, 58]
    max-paginas: 10
    # Tipos acompanhados pela coleta: projeto de lei, de lei complementar, PEC e projeto de decreto legislativo.
    tipos: [PL, PLP, PEC, PDL]

  senado:
    base-url: https://legis.senado.leg.br/dadosabertos
    parametro-autor: codigoParlamentarAutor
    legislaturas: [58]
    tipos: [PL, PLP, PEC, PDL]

  # Casas estaduais/municipais que usam SAPL. Confirme a URL de cada uma
  # (normalmente https://sapl.<cidade>.<uf>.leg.br) e se a API está aberta.
  # Cada casa entra em toda busca sem fonte: não deixe URLs fictícias aqui.
  sapl: []
  #  - slug: campinas
  #    nome: Câmara Municipal de Campinas
  #    esfera: CAMARA_MUNICIPAL
  #    uf: SP
  #    municipio: CAMPINAS
  #    base-url: https://sapl.campinas.sp.leg.br

  tse:
    url-template: https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_{ano}.zip
    diretorio-cache: ./dados/tse

  coleta:
    habilitada: true
    cron: "0 0 * * * *"   # de hora em hora
    dias-iniciais: 30
